backend:
  name: git-gateway
  branch: main
media_folder: "public/images/uploads"
public_folder: "/images/uploads"
site_url: https://eichenbergassociates.com
logo_url: /images/logo-color.png

collections:
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Firm details & navigation
        file: src/content/settings/site.json
        fields:
          - { name: name, label: Firm name }
          - { name: tagline, label: Tagline }
          - { name: positioning, label: Positioning line }
          - { name: description, label: Default meta description, widget: text }
          - { name: email, label: Email }
          - { name: phone, label: Phone (display) }
          - { name: phoneHref, label: Phone (tel: link, digits only) }
          - { name: linkedin, label: LinkedIn URL }
          - { name: responseWindow, label: Reply window (e.g. two business days) }
          - name: nav
            label: Navigation
            widget: list
            fields: [{ name: label, label: Label }, { name: href, label: Path }]

      - name: hero
        label: Homepage hero
        file: src/content/settings/hero.json
        fields:
          - { name: eyebrow, label: Eyebrow line }
          - { name: headlineAccent1, label: Headline line 1 — teal word }
          - { name: headlineRest1, label: Headline line 1 — rest }
          - { name: headlineAccent2, label: Headline line 2 — teal word }
          - { name: headlineRest2, label: Headline line 2 — rest }
          - { name: subtitle, label: Subtitle, widget: text }
          - { name: ctaLabel, label: Primary button label }
          - { name: ctaHref, label: Primary button link }
          - { name: secondaryLabel, label: Secondary button label }
          - { name: secondaryHref, label: Secondary button link }
          - { name: backgroundImage, label: Background image, widget: image, required: false, hint: "JPEG/WebP, ≤1920px wide, under 400 KB. Leave empty for the solid navy hero." }
          - { name: backgroundVideo, label: Background video (MP4 URL), required: false, hint: "Optional. Muted, looping. Keep under 5 MB; the image above is used as the poster." }
          - { name: backgroundAlt, label: Background image description (alt text), required: false }
          - { name: tint, label: Navy tint over background (0 = none, 1 = solid), widget: number, value_type: float, min: 0, max: 1, step: 0.02, default: 0.72 }
          - { name: showDashboard, label: Show the animated readiness dashboard, widget: boolean, default: true }

      - name: feeds
        label: Insights feed (RSS)
        file: src/content/settings/feeds.json
        fields:
          - { name: showOnHome, label: Show "Latest insights" section on the home page, widget: boolean, default: true }
          - { name: homeEyebrow, label: Home section eyebrow }
          - { name: homeHeading, label: Home section heading }
          - { name: homeCount, label: Posts to show on home, widget: number, min: 1, max: 6, default: 3 }
          - { name: cacheMinutes, label: Refresh feeds every (minutes), widget: number, default: 30 }
          - name: sources
            label: Feed sources
            label_singular: Feed
            widget: list
            hint: "Standard RSS/Atom URLs, or an rss.app feed URL (.xml or .json). Untick 'Enabled' to pause a source without deleting it."
            fields:
              - { name: name, label: Display name (shown as the tag on each post) }
              - { name: url, label: Feed URL }
              - { name: enabled, label: Enabled, widget: boolean, default: true }

  - name: pages
    label: Website pages (copy)
    description: "Every headline, paragraph and button on the existing pages. Edit → Publish; the site rebuilds in about a minute."
    files:
      - name: home
        label: Home page
        file: src/content/pages/home.json
        fields:
          - { name: title, label: Browser title }
          - name: gap
            label: "Section: The gap"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }, { name: heading, label: Heading, widget: text }, { name: paragraphs, label: Paragraphs, widget: list }, { name: closing, label: Closing line }]
          - name: offers
            label: "Section: What we offer"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }, { name: heading, label: Heading }, { name: link, label: Link text }]
          - name: who
            label: "Section: Who this is for"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }, { name: heading, label: Heading }, { name: lead, label: Lead }, { name: link, label: Link text }, { name: facts, label: Facts, widget: list, fields: [{ name: label, label: Label }, { name: text, label: Text, widget: text }] }]
          - name: approach
            label: "Section: How an engagement runs"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }, { name: heading, label: Heading }, { name: phases, label: Phases, widget: list, fields: [{ name: num, label: Number }, { name: name, label: Name }, { name: text, label: Text, widget: text }] }, { name: footnote, label: Footnote }]
          - name: testimonials
            label: "Section: Testimonials"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }]
          - name: partners
            label: "Section: For SI partners"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }, { name: heading, label: Heading, widget: text }, { name: text, label: Text, widget: text }, { name: link, label: Link text }]
          - name: cta
            label: "Section: The first call (grid)"
            widget: object
            fields: [{ name: eyebrow, label: Eyebrow }, { name: heading, label: Heading }, { name: text, label: Text, widget: text }, { name: prompt, label: Prompt under grid }, { name: label, label: Button label }]
      - name: services
        label: Services page (intro)
        file: src/content/pages/services.json
        fields:
          - { name: title, label: Browser title }
          - { name: description, label: Meta description, widget: text }
          - { name: eyebrow, label: Eyebrow }
          - { name: heading, label: Heading }
          - { name: lead, label: Lead, widget: text }
          - { name: timeline, label: Timeline, widget: list, fields: [{ name: when, label: When }, { name: what, label: What }] }
      - name: who-we-serve
        label: Who we serve page
        file: src/content/pages/who-we-serve.json
        fields:
          - { name: title, label: Browser title }
          - { name: description, label: Meta description, widget: text }
          - { name: eyebrow, label: Eyebrow }
          - { name: heading, label: Heading }
          - { name: lead, label: Lead, widget: text }
          - { name: facts, label: Profile facts, widget: list, fields: [{ name: label, label: Label }, { name: text, label: Text, widget: text }] }
          - { name: footer, label: Footer line }
          - { name: footerLink, label: Footer link text }
      - name: partners
        label: For SI partners page
        file: src/content/pages/partners.json
        fields:
          - { name: title, label: Browser title }
          - { name: description, label: Meta description, widget: text }
          - { name: eyebrow, label: Eyebrow }
          - { name: heading, label: Heading }
          - { name: lead, label: Lead, widget: text }
          - { name: coverHeading, label: Cover chart heading }
          - { name: youCover, label: "You cover (list)", widget: list }
          - { name: weCover, label: "We cover (list)", widget: list }
          - { name: why, label: Why cards, widget: list, fields: [{ name: heading, label: Heading }, { name: text, label: Text, widget: text }] }
          - { name: cta, label: Closing CTA, widget: object, fields: [{ name: heading, label: Heading }, { name: text, label: Text, widget: text }, { name: label, label: Button label }] }
      - name: about
        label: About page
        file: src/content/pages/about.json
        fields:
          - { name: title, label: Browser title }
          - { name: description, label: Meta description, widget: text }
          - { name: mission, label: Mission, widget: text }
          - { name: vision, label: Vision, widget: text }
          - { name: values, label: Values, widget: list, fields: [{ name: name, label: Name }, { name: text, label: Text, widget: text }] }
          - { name: how, label: How we work cards, widget: list, fields: [{ name: label, label: Label }, { name: text, label: Text, widget: text }] }
      - name: insights
        label: Insights page (intro)
        file: src/content/pages/insights.json
        fields:
          - { name: title, label: Browser title }
          - { name: description, label: Meta description, widget: text }
          - { name: eyebrow, label: Eyebrow }
          - { name: heading, label: Heading }
          - { name: lead, label: Lead, widget: text }
          - { name: newsletterHeading, label: Newsletter heading }
          - { name: newsletterText, label: Newsletter text }
      - name: contact
        label: Contact page
        file: src/content/pages/contact.json
        fields:
          - { name: title, label: Browser title }
          - { name: description, label: Meta description, widget: text }
          - { name: eyebrow, label: Eyebrow }
          - { name: heading, label: Heading }
          - { name: lead, label: Lead, widget: text }
          - { name: successHeading, label: Success heading }
          - { name: successText, label: Success text, widget: text }

  - name: customPages
    label: New pages (page builder)
    label_singular: Page
    description: "Create any new page from building blocks. Published pages live at /p/<slug>; tick 'Show in navigation' to add a menu item."
    folder: src/content/custom-pages
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Page title }
      - { name: slug, label: "URL slug (lowercase, hyphens)", pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"] }
      - { name: description, label: Meta description, widget: text }
      - { name: published, label: Published, widget: boolean, default: false }
      - { name: inNav, label: Show in navigation, widget: boolean, default: false }
      - name: blocks
        label: Page blocks
        widget: list
        types:
          - { name: hero, label: Hero, widget: object, fields: [{ name: eyebrow, label: Eyebrow, required: false }, { name: heading, label: Heading }, { name: text, label: Text, widget: text, required: false }, { name: dark, label: Navy background, widget: boolean, default: true }] }
          - { name: text, label: Text (Markdown), widget: object, fields: [{ name: heading, label: Heading, required: false }, { name: body, label: Body, widget: markdown }] }
          - { name: two-column, label: Two columns (heading left, text right), widget: object, fields: [{ name: eyebrow, label: Eyebrow, required: false }, { name: heading, label: Heading }, { name: body, label: Body, widget: markdown }] }
          - { name: bullets, label: Bullet list, widget: object, fields: [{ name: heading, label: Heading, required: false }, { name: items, label: Items, widget: list }] }
          - { name: quote, label: Pull quote, widget: object, fields: [{ name: text, label: Quote, widget: text }, { name: cite, label: Attribution, required: false }] }
          - { name: image, label: Image, widget: object, fields: [{ name: src, label: Image, widget: image }, { name: alt, label: Alt text }, { name: caption, label: Caption, required: false }] }
          - { name: cta, label: Call to action, widget: object, fields: [{ name: heading, label: Heading }, { name: text, label: Text, widget: text, required: false }, { name: label, label: Button label, default: "Start a conversation" }, { name: href, label: Button link, default: "/contact" }] }
      - { name: body, label: " ", widget: hidden, default: "" }

  - name: services
    label: Services
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title }
      - { name: order, label: Order, widget: number }
      - { name: when, label: When in the go-live (eyebrow) }
      - { name: summary, label: Summary (home card), widget: text }
      - { name: lead, label: Lead sentence, widget: text }
      - { name: who, label: Who it's for, widget: text }
      - { name: points, label: What you get, widget: list }
      - { name: message, label: Key message (quote) }
      - { name: cta, label: Button label }
      - { name: price, label: Price (internal unless shown), required: false }
      - { name: showPrice, label: Show price publicly, widget: boolean, default: false }
      - { name: body, label: Detail (optional), widget: markdown, required: false }

  - name: situations
    label: Who we serve — situations
    folder: src/content/situations
    create: true
    extension: json
    fields:
      - { name: order, label: Order, widget: number }
      - { name: role, label: Role line }
      - { name: headline, label: Headline }
      - { name: trigger, label: Trigger }
      - { name: pains, label: Pain points, widget: list }
      - { name: message, label: Message }
      - { name: href, label: Link to service (path) }
      - { name: cta, label: Link label }

  - name: team
    label: Team
    folder: src/content/team
    create: true
    fields:
      - { name: name, label: Name }
      - { name: role, label: Role }
      - { name: photo, label: Photo, widget: image, required: false }
      - { name: order, label: Order, widget: number, default: 1 }
      - { name: body, label: Bio, widget: markdown }

  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    extension: json
    fields:
      - { name: order, label: Order, widget: number }
      - { name: text, label: Quote, widget: text }
      - { name: name, label: Name }
      - { name: title, label: Title }
      - { name: confirmed, label: Confirmed current, widget: boolean, default: false }

  - name: insights
    label: Insights
    folder: src/content/insights
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title }
      - { name: description, label: Description (meta), widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: tag, label: Tag, default: Readiness }
      - { name: author, label: Author, default: Jennifer Eichenberg }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }
