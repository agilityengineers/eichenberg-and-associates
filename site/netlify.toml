[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://plausible.io https://identity.netlify.com https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plausible.io https://identity.netlify.com https://*.supabase.co https://esm.sh; frame-src https://challenges.cloudflare.com https://calendly.com https://*.calendly.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/speaking-engagements"
  to = "/about"
  status = 301
[[redirects]]
  from = "/resources"
  to = "/insights"
  status = 301
[[redirects]]
  from = "/book-a-meeting"
  to = "/contact"
  status = 301
